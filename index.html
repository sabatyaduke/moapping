<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>もあっぴーーー✌</title>
  <style>
    /* 変数の定義（ライトモード標準） */
    :root {
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #6200ee;
      --border-color: #ccc;
      --input-bg: #fff;
    }

    /* ダークモード用の変数上書き */
    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #bb86fc;
      --border-color: #333;
      --input-bg: #252525;
    }

    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s, color 0.3s;
    }

    .container { width: 100%; max-width: 600px; }

    /* モード切替ボタンのスタイル */
    .mode-toggle {
      text-align: right;
      margin-bottom: 10px;
    }
    #themeBtn {
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      width: auto; /* ボタン幅を自動に */
    }

    .input-box {
      width: 100%; height: 100px; padding: 12px;
      font-size: 16px; background-color: var(--input-bg);
      color: var(--text-color); border: 2px solid var(--border-color);
      border-radius: 12px; outline: none;
    }
    button {
      width: 100%; margin-top: 12px; padding: 14px;
      font-size: 16px; font-weight: bold;
      background-color: var(--accent-color); color: #fff;
      border: none; border-radius: 12px; cursor: pointer;
    }
    body.dark-mode button { color: #000; } /* ダークモード時は文字を黒に */
    
    button:disabled { background-color: #555; }
    .result {
      margin-top: 25px; background: var(--card-bg);
      padding: 20px; border-radius: 16px; width: 100%;
      min-height: 100px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: none;
    }
    .title-img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
    .cursor { display: inline-block; margin-left: 2px; color: var(--accent-color); animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="mode-toggle">
      <button id="themeBtn" onclick="toggleTheme()">モード切替</button>
    </div>
    <h1>もあっぴーーー✌</h1>
    <textarea id="inputBox" class="input-box" placeholder="なにか入力してね..."></textarea>
    <button id="sendButton" onclick="showRandom()">送信</button>
    <div id="result" class="result">
      <img id="titleImage" class="title-img">
      <p><span id="text"></span><span id="cursor" class="cursor">│</span></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
